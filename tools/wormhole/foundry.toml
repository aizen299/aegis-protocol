[profile.default]
src = "src"
out = "out"
libs = ["lib", "../../contracts/lib"]
allow_paths = ["../../contracts/lib"]
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../contracts/lib/forge-std/src/",
]

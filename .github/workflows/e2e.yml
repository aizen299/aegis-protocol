name: End-to-End

on:
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", "zk/**", "solana/**", "tools/**", "scripts/e2e.sh", "scripts/solana-validator.sh", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", "zk/**", "solana/**", "tools/**", "scripts/e2e.sh", "scripts/solana-validator.sh", ".github/workflows/e2e.yml"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every other suite tests a component against a mock of its neighbour. This is the only job where
  # a real contract emits a real log that a real indexer writes to a real database.
  smoke:
    runs-on: ubuntu-latest
    # Above the go test -timeout below, deliberately. Go's timeout prints a stack dump naming the
    # hung test; a job killed by GitHub first would just say "cancelled".
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: pb
          POSTGRES_PASSWORD: pb_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: local
      DB_DSN: postgres://pb:pb_local@localhost:5432/aegis?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        run: |
          for migration in backend/migrations/*.up.sql; do
            psql "$DB_DSN" -v ON_ERROR_STOP=1 -f "$migration"
          done

      # The zk end-to-end proves against the gate address that deployment produced, so it needs
      # the real proving toolchain. Without it those tests skip, and the assertion below turns a
      # skip into a failure.
      - name: Install the pinned Noir toolchain
        run: |
          set -euo pipefail
          NARGO_VERSION=$(awk '/^nargo /{print $2}' zk/circuits/toolchain.txt)
          mkdir -p "$HOME/.nargo/bin"
          curl -fsSL "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/noir-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.nargo/bin"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          PATH="$HOME/.nargo/bin:$PATH" "$HOME/.bb/bbup"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
      - name: Install the witness generator's dependencies
        run: cd tools/poseidon && npm ci --no-audit --no-fund

      # The Solana vault end-to-end needs the program built and a validator running. Tool versions and
      # cache key match Solana CI, so a run there fills the cache this job reads.
      - uses: actions/cache@v4
        id: solana-tools
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: solana-tools-${{ runner.os }}-3.1.10-1.1.2
      - name: Install Solana and Anchor
        if: steps.solana-tools.outputs.cache-hit != 'true'
        run: |
          curl --fail -sSfL "https://release.anza.xyz/v3.1.10/install" -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          cargo install anchor-cli --version 1.1.2 --locked
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the Solana vault program
        run: make solana-build
      - name: Start solana-test-validator
        run: |
          scripts/solana-validator.sh "$RUNNER_TEMP/solana"
          echo "SOLANA_E2E=1" >> "$GITHUB_ENV"
          echo "SOLANA_E2E_AUTHORITY=$RUNNER_TEMP/solana/authority.json" >> "$GITHUB_ENV"

      - name: Start anvil
        run: |
          anvil --port 8545 --chain-id 31337 --silent &
          for _ in $(seq 1 30); do
            cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::anvil did not become reachable"
          exit 1

      # The suite skips rather than fails when its dependencies are missing, so assert it actually
      # ran — a silently skipped smoke test is worse than no smoke test.
      - name: Run the end-to-end suite
        working-directory: backend
        run: |
          # Explicit -timeout: Go defaults to 10 minutes and this suite measures around four, but
          # it grows with every proof-generating test, and crossing the default fails with a
          # message that reads like a test failure rather than a timeout.
          go test -tags e2e ./internal/e2e/... -count=1 -timeout 25m -v 2>&1 | tee /tmp/e2e.log
          if grep -q -- "--- SKIP" /tmp/e2e.log; then
            echo "::error::End-to-end tests skipped — anvil, postgres, or redis was unreachable."
            exit 1
          fi
          for required in \
            TestDepositFlowPreservesRawSixDecimalAmount \
            TestOracleRoundSettlesWithGoSignedSubmissions \
            TestOracleEventsAreIndexedFromRealLogs \
            TestGovernanceProposalReachesExecution \
            TestGovernanceRemoteProposalNeverPerformsALocalCall \
            TestGovernanceCancelledProposalClearsTheQueue \
            TestGovernanceLifecycleIsIndexedFromRealLogs \
            TestGovernanceAPIServesIndexedRows \
            TestGovernanceReindexingIsIdempotent \
            TestReindexingIsIdempotent \
            TestRoleMigrationOnALocalDeployment \
            TestZkPrivateActionExecutesAndCannotBeReplayed \
            TestZkProofFromAnotherGateIsRejected \
            TestZkLifecycleIsIndexedFromRealLogs \
            TestZkAPIServesIndexedRows \
            TestServedZkRowsCarryNoSender \
            TestZkReindexingIsIdempotent \
            TestTheAnonymitySetTracksTheTree \
            TestASolanaDepositIsIndexedAndServedBesideAnArbitrumOne \
            TestASolanaOracleRoundIsSubmittedFromGoAndIndexed; do
            grep -q -- "--- PASS: $required" /tmp/e2e.log || {
              echo "::error::$required did not run."
              exit 1
            }
          done

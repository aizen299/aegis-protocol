name: Contracts CI

on:
  push:
    branches: [main]
    paths: ["contracts/**", "tools/poseidon/**", "Makefile", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "tools/poseidon/**", "Makefile", ".github/workflows/contracts.yml"]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: contracts

jobs:
  # Poseidon is generated from circomlib and committed as Solidity. This is the only job that needs
  # Node: `forge build` and `forge test` read the committed artifact and never invoke a generator.
  # Kept separate for that reason — the same split the ABI-drift job uses.
  poseidon-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/poseidon/package-lock.json
      - name: Fail if the committed Poseidon differs from a fresh generation
        run: make poseidon-check

  test:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      # Storage layout is append-only for UUPS. Diverging from the released baseline is a
      # corrupted upgrade, so it fails the build rather than waiting to be noticed at deploy time.
      - name: Storage layout matches the released baseline
        run: make contracts-layout-check
        working-directory: .
      - run: forge coverage --report lcov
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: contracts/lcov.info

  # Slither is mandatory before a contract is considered complete. HIGH/MEDIUM findings fail the
  # build; suppressions are inline and justified in contracts/README.md.
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: medium

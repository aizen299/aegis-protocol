name: Frontend CI

on:
  push:
    branches: [main]
    # backend/pkg/types and backend/pkg/contracts are included because the frontend hand-mirrors
    # both — the API's structs and the contracts' ABIs. A change on the backend side must fail here,
    # not at runtime as an undefined field or a transaction with the wrong selector.
    paths:
      ["frontend/**", "backend/pkg/types/**", "backend/pkg/contracts/**", "scripts/check-api-types.py", ".github/workflows/frontend.yml"]
  pull_request:
    paths:
      ["frontend/**", "backend/pkg/types/**", "backend/pkg/contracts/**", "scripts/check-api-types.py", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Fail if the frontend's API types have drifted from the backend's
        working-directory: .
        run: python3 scripts/check-api-types.py
      - run: npm run typecheck
      - run: npm run lint
      # Ordered before the build: a build proves the code compiles, not that it behaves. The
      # dashboard's read-state handling regressed silently for a whole release because nothing here
      # asserted behaviour.
      - run: npm test
      - run: npm run build

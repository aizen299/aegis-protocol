name: zk CI

on:
  push:
    branches: [main]
    paths: ["zk/**", "contracts/src/zk/**", "contracts/generated/**", "tools/**", "Makefile", ".github/workflows/zk.yml"]
  pull_request:
    paths: ["zk/**", "contracts/src/zk/**", "contracts/generated/**", "tools/**", "Makefile", ".github/workflows/zk.yml"]

concurrency:
  group: zk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: zk

jobs:
  circuits:
    runs-on: ubuntu-latest
    # The circuit is the security boundary: an unconstrained signal is a forgery, not a bug in a
    # service that can be patched. Its tests run on their own, before anything else.
    #
    # Overrides the workflow's `zk` default so every path below is written from the repo root. The
    # Makefile lives there, and relying on a step-level override to climb back out is a guess about
    # Actions' path resolution that this job does not need to make.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # Downloads the pinned release directly rather than going through noirup. noirup with no
      # arguments installs "latest stable", which is the opposite of a pin, and piping its script
      # to bash runs that install before noirup is on disk to be re-invoked with a version.
      # --fail matters: without it curl exits 0 on a 404 page and tar fails with a confusing error
      # about the archive rather than the missing tag.
      - name: Install the pinned Noir toolchain
        run: |
          set -euo pipefail
          NARGO_VERSION=$(awk '/^nargo /{print $2}' zk/circuits/toolchain.txt)
          mkdir -p "$HOME/.nargo/bin"
          curl -fsSL "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/noir-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.nargo/bin"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/nargo" --version

          # bb is not optional: it generates the verifier, and it is not independent of nargo.
          # bbup reads the installed nargo and resolves the compatible bb from Aztec's map.
          curl -fsSL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          PATH="$HOME/.nargo/bin:$PATH" "$HOME/.bb/bbup"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          "$HOME/.bb/bb" --version
      - name: Fail if the toolchain drifts from the pin
        run: make zk-toolchain-check
      - name: Circuit tests
        run: make zk-circuits-test
      # Cross-language invariant: the contract's depth is not visible to the circuit's compiler.
      - name: Fail if the circuit and the contract disagree on tree depth
        run: make zk-depth-check
      # The verifier is a function of the circuit and the toolchain. A circuit change that does not
      # regenerate it leaves a verifier no proof can satisfy.
      - name: Fail if the committed verifier differs from a fresh generation
        run: make zk-verifier-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

name: Backend CI

on:
  push:
    branches: [main]
    # contracts/src is included because the committed ABI is generated from it: a contract change
    # that is not mirrored into backend/pkg/contracts must fail here, not at runtime.
    paths: ["backend/**", "contracts/src/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/src/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: pb
          POSTGRES_PASSWORD: pb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: local
      DB_DSN: postgres://pb:pb@localhost:5432/aegis_test?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

  # The architecture tests enforce the multi-chain boundary from docs/project-spec.md §7.
  # Run separately so a boundary violation is legible in the job list.
  boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - run: go test ./internal/architecture/... -v

  # Every source file must reach a clean checkout. A .gitignore pattern that swallows a package is
  # invisible locally and only surfaces as a build failure here, so assert it directly.
  tracked-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any Go source file is untracked in the checkout
        run: |
          missing=$(comm -23 \
            <(find backend -name '*.go' -not -path '*/vendor/*' | sort) \
            <(git ls-files 'backend/**/*.go' | sort))
          if [ -n "$missing" ]; then
            echo "::error::These files are not tracked by git — check .gitignore for an unanchored pattern:"
            echo "$missing"
            exit 1
          fi

  abi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: foundry-rs/foundry-toolchain@v1
      # Exporting and comparing are separate steps on purpose: folding them together with `||` made
      # a failed export report as "ABI is stale", which is the wrong diagnosis.
      - name: Export the ABI from contracts/
        working-directory: contracts
        run: forge inspect VaultEngine abi --json > "$RUNNER_TEMP/current.abi.json"
      - name: Fail if the committed ABI is stale
        run: |
          if ! diff -u \
              <(jq -S . backend/pkg/contracts/vaultengine/VaultEngine.abi.json) \
              <(jq -S . "$RUNNER_TEMP/current.abi.json"); then
            echo "::error::Committed ABI does not match contracts/. Run 'make backend-abi' and commit the result."
            exit 1
          fi

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
verbosity = 2
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512
max_test_rejects = 100_000

[profile.default.invariant]
runs = 128
depth = 64
# Strict on purpose. A handler that reverts is a handler that stopped exercising the contract, and
# the failure is silent under the lenient setting — it hid a seed overflow that turned the oracle
# submit action into a no-op on a slice of the input space.
fail_on_revert = true
call_override = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
# Generated output is not source and must not be reformatted: forge fmt rewrites it, the fresh
# generation does not match, and `forge fmt --check` and `make poseidon-check` then fail each
# other's output forever.
ignore = ["src/zk/poseidon/PoseidonBytecode.sol", "generated/HonkVerifier.sol", "test/utils/ProofFixture.sol"]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
sort_imports = true

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = {key = "${ARBISCAN_API_KEY}", chain = 421614}

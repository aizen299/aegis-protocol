name: aegis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: pb
      POSTGRES_PASSWORD: pb_local
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pb -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports: ["8545:8545"]

  # One-shot. Runs to completion before the services that depend on it start.
  migrate:
    build:
      context: ./backend
      dockerfile: docker/migrate.Dockerfile
    command: ["-database", "postgres://pb:pb_local@postgres:5432/aegis?sslmode=disable", "up"]
    depends_on:
      postgres: {condition: service_healthy}

  indexer:
    build:
      context: ./backend
      dockerfile: docker/indexer.Dockerfile
    environment:
      SERVICE_NAME: indexer
      APP_ENV: ${APP_ENV:?set APP_ENV to local, staging, or production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_DSN: postgres://pb:pb_local@postgres:5432/aegis?sslmode=disable
      REDIS_ADDR: redis:6379
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://anvil:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      CHAIN_CONFIRM_BLOCKS: ${CHAIN_CONFIRM_BLOCKS:-1}
      CHAIN_START_BLOCK: ${CHAIN_START_BLOCK:-0}
      CONTRACT_VAULT_ENGINE: ${CONTRACT_VAULT_ENGINE:?set CONTRACT_VAULT_ENGINE to the deployed proxy}
      CONTRACT_ORACLE_ROUNDS: ${CONTRACT_ORACLE_ROUNDS:-}
      CONTRACT_ORACLE_STAKING: ${CONTRACT_ORACLE_STAKING:-}
      CONTRACT_ORACLE_STAKE_TOKEN: ${CONTRACT_ORACLE_STAKE_TOKEN:-}
      CONTRACT_GOVERNOR: ${CONTRACT_GOVERNOR:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  api:
    build:
      context: ./backend
      dockerfile: docker/api.Dockerfile
    # 8080 is deliberately avoided: it is commonly taken by Jenkins on developer machines.
    ports: ["8090:8090"]
    environment:
      SERVICE_NAME: api
      APP_ENV: ${APP_ENV:?set APP_ENV to local, staging, or production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_DSN: postgres://pb:pb_local@postgres:5432/aegis?sslmode=disable
      REDIS_ADDR: redis:6379
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://anvil:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      API_ADDR: ":8090"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # Holds the SLASHER_ROLE key, so it is the one service that can move value. Profiled off by
  # default: bringing up the stack should not start a signer unless it is wanted.
  aggregator:
    build:
      context: ./backend
      dockerfile: docker/aggregator.Dockerfile
    profiles: ["oracle"]
    environment:
      SERVICE_NAME: aggregator
      APP_ENV: ${APP_ENV:?set APP_ENV to local, staging, or production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_DSN: postgres://pb:pb_local@postgres:5432/aegis?sslmode=disable
      REDIS_ADDR: redis:6379
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://anvil:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      CONTRACT_ORACLE_ROUNDS: ${CONTRACT_ORACLE_ROUNDS:?the aggregator needs the oracle contracts}
      CONTRACT_ORACLE_STAKING: ${CONTRACT_ORACLE_STAKING:?the aggregator needs the oracle contracts}
      SLASHER_KEY_REF: ${SLASHER_KEY_REF:-SLASHER_PRIVATE_KEY}
      SLASHER_PRIVATE_KEY: ${SLASHER_PRIVATE_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # One node. A realistic local network runs several with different keys; this is the shape.
  # Profiled off by default for the same reason as the aggregator: it holds a key.
  oraclenode:
    build:
      context: ./backend
      dockerfile: docker/oraclenode.Dockerfile
    profiles: ["oracle"]
    environment:
      SERVICE_NAME: oraclenode
      APP_ENV: ${APP_ENV:?set APP_ENV to local, staging, or production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_DSN: postgres://pb:pb_local@postgres:5432/aegis?sslmode=disable
      REDIS_ADDR: redis:6379
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://anvil:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      CONTRACT_ORACLE_ROUNDS: ${CONTRACT_ORACLE_ROUNDS:?the node needs the oracle contracts}
      CONTRACT_ORACLE_STAKING: ${CONTRACT_ORACLE_STAKING:?the node needs the oracle contracts}
      NODE_KEY_REF: ${NODE_KEY_REF:-NODE_PRIVATE_KEY}
      NODE_PRIVATE_KEY: ${NODE_PRIVATE_KEY:-}
      NODE_FEED_NAME: ${NODE_FEED_NAME:-ETH/USD}
      NODE_SOURCES: ${NODE_SOURCES:-}
      NODE_SOURCE_PATHS: ${NODE_SOURCE_PATHS:-}
      NODE_MIN_SOURCES: ${NODE_MIN_SOURCES:-3}
      AWS_REGION: ${AWS_REGION:-}
    depends_on:
      anvil: {condition: service_started}

  zk-service:
    build:
      context: ./zk
      dockerfile: Dockerfile
    ports: ["8081:8081"]
    profiles: ["zk"]

volumes:
  pgdata:
  redisdata:
